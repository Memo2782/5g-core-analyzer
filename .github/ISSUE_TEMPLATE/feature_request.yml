name: Feature Request
about: Request a new feature for the 5G Core Analyzer
title: '[FEATURE] '
labels: enhancement
body:
  - type: textarea
    attributes:
      label: Feature description
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use case
      description: What problem does this solve? Why do you need this feature?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed approach
      description: If you have an idea of how this could be implemented.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Willing to help?
      options:
        - label: I'm willing to contribute this feature (submit a PR)
          required: false
        - label: I'd pay for this feature in a commercial license
          required: false
