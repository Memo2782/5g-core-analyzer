name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - e2e
          - mcp
          - reactive
          - unit

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'unit' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 || true

  setup-5gc:
    name: Setup 5G Core Environment
    runs-on: ubuntu-latest
    outputs:
      setup-dir: ${{ steps.set.outputs.setup_dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Open5GS docker setup
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/Borjis131/docker-open5gs.git
          ls -la docker-open5gs/

      - name: Create docker-compose.yml
        run: |
          cd /tmp/docker-open5gs
          cat > docker-compose.yml << 'COMPOSE'
          services:
            db:
              container_name: db
              image: mongo:6.0
              command: "mongod --bind_ip 0.0.0.0 --port 27017"
              networks:
                - open5gs
              volumes:
                - db_data:/data/db
                - db_config:/data/configdb
              ports:
                - "27017:27017"
            nrf:
              container_name: nrf
              image: borieher/nrf:v2.7.6
              command: "-c /etc/open5gs/custom/nrf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/nrf.yaml:/etc/open5gs/custom/nrf.yaml
              depends_on:
                - db
            ausf:
              container_name: ausf
              image: borieher/ausf:v2.7.6
              command: "-c /etc/open5gs/custom/ausf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/ausf.yaml:/etc/open5gs/custom/ausf.yaml
              depends_on:
                - nrf
            udm:
              container_name: udm
              image: borieher/udm:v2.7.6
              command: "-c /etc/open5gs/custom/udm.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/udm.yaml:/etc/open5gs/custom/udm.yaml
              depends_on:
                - nrf
            udr:
              container_name: udr
              image: borieher/udr:v2.7.6
              command: "-c /etc/open5gs/custom/udr.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/udr.yaml:/etc/open5gs/custom/udr.yaml
              depends_on:
                - db
                - nrf
            pcf:
              container_name: pcf
              image: borieher/pcf:v2.7.6
              command: "-c /etc/open5gs/custom/pcf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/pcf.yaml:/etc/open5gs/custom/pcf.yaml
              depends_on:
                - db
                - nrf
            amf:
              container_name: amf
              image: borieher/amf:v2.7.6
              command: "-c /etc/open5gs/custom/amf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/amf.yaml:/etc/open5gs/custom/amf.yaml
                - ./logs:/var/log/open5gs
              depends_on:
                - nrf
                - ausf
                - udm
            smf:
              container_name: smf
              image: borieher/smf:v2.7.6
              command: "-c /etc/open5gs/custom/smf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/smf.yaml:/etc/open5gs/custom/smf.yaml
                - ./logs:/var/log/open5gs
              depends_on:
                - nrf
                - udm
                - pcf
            upf:
              container_name: upf
              image: borieher/upf:v2.7.6
              command: "-c /etc/open5gs/custom/upf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/upf.yaml:/etc/open5gs/custom/upf.yaml
              devices:
                - /dev/net/tun:/dev/net/tun
              sysctls:
                - net.ipv4.ip_forward=1
              cap_add:
                - NET_ADMIN
              depends_on:
                - smf
            nssf:
              container_name: nssf
              image: borieher/nssf:v2.7.6
              command: "-c /etc/open5gs/custom/nssf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/nssf.yaml:/etc/open5gs/custom/nssf.yaml
              depends_on:
                - nrf
            bsf:
              container_name: bsf
              image: borieher/bsf:v2.7.6
              command: "-c /etc/open5gs/custom/bsf.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/metrics/bsf.yaml:/etc/open5gs/custom/bsf.yaml
              depends_on:
                - nrf
            scp:
              container_name: scp
              image: borieher/scp:v2.7.6
              command: "-c /etc/open5gs/custom/scp.yaml"
              networks:
                - open5gs
              volumes:
                - ./configs/scp/model-c/scp.yaml:/etc/open5gs/custom/scp.yaml
              depends_on:
                - nrf
          volumes:
            db_data:
            db_config:
          networks:
            open5gs:
              driver: bridge
          COMPOSE
          echo "docker-compose.yml created"
          # Verify required config files exist
          ls -la configs/metrics/upf.yaml configs/metrics/amf.yaml configs/metrics/smf.yaml configs/scp/model-c/scp.yaml

      - name: Create UERANSIM configs
        run: |
          mkdir -p /tmp/docker-open5gs/ueransim-config
          cat > /tmp/docker-open5gs/ueransim-config/gnb.yaml << 'EOF'
          mcc: '001'
          mnc: '01'
          nci: '0x000000010'
          idLength: 32
          tac: 1
          linkIp: 0.0.0.0
          ngapIp: 0.0.0.0
          gtpIp: 0.0.0.0
          amfConfigs:
            - address: amf
              port: 38412
          slices:
            - sst: 1
              sd: 1
          ignoreStreamIds: true
          EOF
          cat > /tmp/docker-open5gs/ueransim-config/ue.yaml << 'EOF'
          supi: 'imsi-001011234567891'
          mcc: '001'
          mnc: '01'
          key: '00000000000000000000000000000000'
          op: '00000000000000000000000000000000'
          opType: 'OPC'
          imei: '356938035643803'
          imeiSv: '4370816125816151'
          gnbSearchList:
            - gnb
          uacAic:
            mps: false
            mcs: false
          uacAcc:
            normalClass: 0
            class11: false
            class12: false
            class13: false
            class14: false
            class15: false
          integrity:
            IA1: true
            IA2: true
            IA3: true
          ciphering:
            EA1: true
            EA2: true
            EA3: true
          integrityMaxRate:
            uplink: 'full'
            downlink: 'full'
          sessions:
            - type: 'IPv4'
              apn: 'internet'
              slice:
                sst: 1
                sd: 1
          EOF

      - name: Create UERANSIM docker-compose
        run: |
          cat > /tmp/docker-open5gs/ueransim-compose.yml << 'EOF'
          version: '3.8'
          services:
            gnb:
              container_name: gnb
              image: gradiant/ueransim:3.2.6
              command: ["gnb"]
              volumes:
                - ./ueransim-config/gnb.yaml:/etc/ueransim/gnb.yaml:ro
              networks:
                - open5gs
            ue:
              container_name: ue
              image: gradiant/ueransim:3.2.6
              command: ["ue"]
              volumes:
                - ./ueransim-config/ue.yaml:/etc/ueransim/ue.yaml:ro
              networks:
                - open5gs
              sysctls:
                - net.ipv4.ip_forward=1
              devices:
                - /dev/net/tun:/dev/net/tun
              cap_add:
                - NET_ADMIN
          networks:
            open5gs:
              external: true
              name: docker-open5gs_open5gs
          EOF

      - name: Create MongoDB init script
        run: |
          cat > /tmp/docker-open5gs/mongo-init.js << 'MONGOJS'
          db = db.getSiblingDB("open5gs");
          db.subscribers.insertOne({
            _id: ObjectId(),
            imsi: "001011234567891",
            schema_version: 1,
            msisdn: ["1555010001"],
            imeisv: ["4370816125816151"],
            security: {
              k: "00000000000000000000000000000000",
              amf: "8000",
              opc: "00000000000000000000000000000000",
              op: null,
              sqn: NumberLong("0")
            },
            ambr: {
              downlink: { value: 1000000000, unit: 0 },
              uplink: { value: 1000000000, unit: 0 }
            },
            network_access_mode: 0,
            subscriber_status: 0,
            operator_determined_barring: 0,
            access_restriction_data: 32,
            subscribed_rau_tau_timer: 12,
            slice: [{
              sst: 1,
              sd: "1",
              default_indicator: true,
              session: [{
                name: "internet",
                type: 3,
                qos: { index: 9, arp: { priority_level: 8, pre_emption_capability: 1, pre_emption_vulnerability: 2 } },
                ambr: { downlink: { value: 1000000000, unit: 0 }, uplink: { value: 1000000000, unit: 0 } },
                pcc_rule: []
              }]
            }],
            __v: 0
          });
          MONGOJS

      - name: Save setup directory path
        id: set
        run: |
          echo "setup_dir=/tmp/docker-open5gs" >> $GITHUB_OUTPUT

      - name: Upload setup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-open5gs-setup
          path: /tmp/docker-open5gs/

  e2e-test:
    name: E2E 5G Network Test
    runs-on: ubuntu-latest
    needs: setup-5gc
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'e2e' }}

    steps:
      - uses: actions/checkout@v5

      - name: Download Open5GS setup
        uses: actions/download-artifact@v4
        with:
          name: docker-open5gs-setup
          path: /tmp/docker-open5gs

      - name: Start Open5GS containers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose up -d
          sleep 30

      - name: Initialize MongoDB subscribers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose cp mongo-init.js db:/tmp/
          docker exec db mongosh --quiet --eval "load('/tmp/mongo-init.js')" open5gs 2>/dev/null || \
          docker exec db mongo --quiet /tmp/mongo-init.js open5gs 2>/dev/null || \
          docker exec db mongosh < /tmp/mongo-init.js 2>/dev/null || true
          sleep 10

      - name: Start UERANSIM containers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose -f ueransim-compose.yml up -d gnb
          sleep 5
          docker compose -f ueransim-compose.yml up -d ue
          sleep 15

      - name: Start analyzer app
        working-directory: .
        env:
          OPEN5GS_LOG_DIR: /tmp/docker-open5gs/logs
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 30

      - name: Wait for UE registration
        working-directory: /tmp/docker-open5gs
        run: |
          sudo chmod -R a+rwX /tmp/docker-open5gs/logs/
          timeout 60 bash -c 'until docker logs ue 2>&1 | grep -q "Initial Registration is successful"; do sleep 2; done' && echo "UE registered" || echo "UE registration timed out"

      - name: Install zsh
        run: |
          sudo apt-get update && sudo apt-get install -y zsh

      - name: Run E2E test
        id: e2e
        env:
          DOCKER_OPEN5GS_DIR: /tmp/docker-open5gs
          ANALYZER_DIR: ${{ github.workspace }}
          API_BASE: http://localhost:8080
          API_KEY: 5ga_xPuiYQrRtTIlzFlnaTEFSRQCIeyoWhDyXXCOI_qpJ2c
          LOG_DIR: /tmp/docker-open5gs/logs
        run: |
          mkdir -p /tmp/e2e-diagnostics
          zsh test_e2e_5g.sh > /tmp/e2e-diagnostics/trace.txt 2>&1
          TEST_EXIT=$?
          echo "EXIT_CODE=${TEST_EXIT}" >> /tmp/e2e-diagnostics/trace.txt
          cat /tmp/e2e-diagnostics/trace.txt
          cat /tmp/e2e-progress.txt 2>/dev/null
          exit ${TEST_EXIT}

      - name: Dump E2E diagnostics
        if: failure()
        working-directory: /tmp/docker-open5gs
        run: |
          DIAG_DIR=/tmp/e2e-diagnostics
          mkdir -p "$DIAG_DIR"
          echo "===== TRACE =====" > "$DIAG_DIR/diagnostics.txt"
          cat "$DIAG_DIR/trace.txt" 2>/dev/null >> "$DIAG_DIR/diagnostics.txt"
          echo "===== PROGRESS =====" >> "$DIAG_DIR/diagnostics.txt"
          cat /tmp/e2e-progress.txt 2>/dev/null >> "$DIAG_DIR/diagnostics.txt"
          PROGRESS=$(cat /tmp/e2e-progress.txt 2>/dev/null || echo "(none)")
          echo "::error::E2E FAIL Progress: $(echo "$PROGRESS" | tr '\n' '|')"
          echo "::error::Trace tail: $(tail -5 "$DIAG_DIR/trace.txt" 2>/dev/null | tr '\n' '|')"
          echo "::error::UE: $(docker logs ue 2>&1 | tail -10 | tr '\n' '|')"
          echo "::error::AMF: $(docker logs amf 2>&1 | tail -10 | tr '\n' '|')"
          echo "::error::gNB: $(docker logs gnb 2>&1 | tail -10 | tr '\n' '|')"
          echo "::error::SMF: $(docker logs smf 2>&1 | tail -10 | tr '\n' '|')"
          echo "===== CONTAINER LOGS =====" >> "$DIAG_DIR/diagnostics.txt"
          for c in db nrf ausf udm udr pcf amf smf upf nssf bsf scp gnb ue; do
            echo "--- $c ---" >> "$DIAG_DIR/diagnostics.txt"
            docker logs "$c" 2>&1 | tail -50 >> "$DIAG_DIR/diagnostics.txt"
          done
          cd ${{ github.workspace }}
          docker compose -f docker-compose.yml logs --tail=100 >> "$DIAG_DIR/diagnostics.txt" 2>&1 || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: /tmp/e2e-diagnostics/
          retention-days: 1

      - name: Cleanup
        if: always()
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose down -v 2>/dev/null || true
          docker compose -f ueransim-compose.yml down -v 2>/dev/null || true

  mcp-test:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    needs: setup-5gc
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'mcp' }}

    steps:
      - uses: actions/checkout@v5

      - name: Download Open5GS setup
        uses: actions/download-artifact@v4
        with:
          name: docker-open5gs-setup
          path: /tmp/docker-open5gs

      - name: Start Open5GS containers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose up -d
          sleep 30

      - name: Initialize MongoDB subscribers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose cp mongo-init.js db:/tmp/ 2>/dev/null || true
          docker exec db mongosh --quiet --eval "load('/tmp/mongo-init.js')" open5gs 2>/dev/null || true
          sleep 5

      - name: Set up Python 3.12 + MCP
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP
        run: |
          pip install -r requirements.txt

      - name: Run MCP server tests
        env:
          OPEN5GS_LOG_DIR: /tmp/docker-open5gs/logs
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python3 mcp_server/test_mcp_server.py

      - name: Cleanup
        if: always()
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose down -v 2>/dev/null || true

  reactive-test:
    name: Reactive MCP Test
    runs-on: ubuntu-latest
    needs: setup-5gc
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'reactive' }}

    steps:
      - uses: actions/checkout@v5

      - name: Download Open5GS setup
        uses: actions/download-artifact@v4
        with:
          name: docker-open5gs-setup
          path: /tmp/docker-open5gs

      - name: Start Open5GS containers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose up -d
          docker compose -f ueransim-compose.yml up -d gnb ue
          sleep 30

      - name: Initialize MongoDB subscribers
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose cp mongo-init.js db:/tmp/ 2>/dev/null || true
          docker exec db mongosh --quiet --eval "load('/tmp/mongo-init.js')" open5gs 2>/dev/null || \
          docker exec db mongo --quiet /tmp/mongo-init.js open5gs 2>/dev/null || \
          docker exec db mongosh < /tmp/mongo-init.js 2>/dev/null || true
          sleep 10

      - name: Make logs writable
        run: |
          sudo chmod -R a+rwX /tmp/docker-open5gs/logs/

      - name: Set up Python 3.12 + MCP
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP
        run: |
          pip install -r requirements.txt

      - name: Run reactive MCP test
        working-directory: ${{ github.workspace }}
        env:
          OPEN5GS_LOG_DIR: /tmp/docker-open5gs/logs
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python3 mcp_server/test_reactive_mcp.py

      - name: Cleanup
        if: always()
        working-directory: /tmp/docker-open5gs
        run: |
          docker compose down -v 2>/dev/null || true
          docker compose -f ueransim-compose.yml down -v 2>/dev/null || true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-test, mcp-test, reactive-test]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "============================================"
          echo "  Integration Test Pipeline Summary"
          echo "============================================"
          echo "  Unit Tests:      ${{ needs.unit-tests.result }}"
          echo "  E2E 5G Network:  ${{ needs.e2e-test.result }}"
          echo "  MCP Server:      ${{ needs.mcp-test.result }}"
          echo "  Reactive MCP:    ${{ needs.reactive-test.result }}"
          echo "============================================"
