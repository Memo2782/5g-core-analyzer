AWSTemplate-Format-Version: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: 5G Core Analyzer - Serverless deployment

Parameters:
  ContainerImage:
    Type: String
    Description: Docker image URI from ECR
  AllowedIp:
    Type: String
    Default: "0.0.0.0/0"
    Description: CIDR block allowed to access the service

Resources:
  # ECR Repository
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: 5g-core-analyzer
      ImageScanningConfiguration:
        scanOnPush: true

  # ALB
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIp

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup

  LoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health

  # Cognito User Pool for authentication
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: 5g-core-analyzer-users

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 5g-core-analyzer-web
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - USER_PASSWORD_AUTH
      CallbackURLs:
        - https://5g-core-analyzer.guillermopineda.github.io/
      LogoutURLs:
        - https://5g-core-analyzer.guillermopineda.github.io/

  # Fargate Service
  FargateService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: 5g-core-analyzer
      Cluster: !Ref EcsCluster
      TaskDefinition: 5g-core-analyzer
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: 5g-core-analyzer
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Service security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # S3 Bucket for trace storage
  TraceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete

  TraceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TraceBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt TraceBucket.Arn
              - !Sub "${TraceBucket.Arn}/*"

Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TraceBucketName:
    Value: !Ref TraceBucket
