version: '3.8'
services:
  5g-analyzer:
    build: .
    ports:
      - "8000:8000"
    environment:
      - STORAGE_BUCKET=5g-core-analyzer-s3
      - STORAGE_PREFIX=uploads/
    volumes:
      - ./uploads:/app/uploads
      - ./data_samples:/app/data_samples
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
